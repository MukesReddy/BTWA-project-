<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — FoodieHub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main style="padding-top:calc(var(--navbar-height) + 2rem)">
    <div class="container" style="max-width:700px">
      <h1 class="page-title" style="margin-bottom:2rem">👤 My Profile</h1>
      <div id="alertBox" style="margin-bottom:1rem"></div>
      <div id="profileContent" class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    async function loadProfile() {
      const user = await fetchCurrentUser();
      if (!user) { window.location.href = '/login.html?redirect=/profile.html'; return; }

      const content = document.getElementById('profileContent');
      const addr = user.address || {};

      content.innerHTML = `
        <div class="card" style="margin-bottom:1.5rem">
          <div class="card-header flex-between">
            <h3 style="font-weight:700">Personal Information</h3>
            <span class="badge ${user.role === 'admin' ? 'badge-admin' : 'badge-customer'}">${esc(user.role)}</span>
          </div>
          <div class="card-body">
            <form id="profileForm">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input type="text" id="name" class="form-control" value="${esc(user.name)}" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Phone</label>
                  <input type="tel" id="phone" class="form-control" value="${esc(user.phone || '')}" placeholder="9876543210" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Email (cannot be changed)</label>
                <input type="email" class="form-control" value="${esc(user.email)}" disabled style="opacity:.6;cursor:not-allowed" />
              </div>
              <button type="submit" class="btn btn-primary" id="saveBtn">💾 Save Changes</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 style="font-weight:700">📍 Delivery Address</h3>
          </div>
          <div class="card-body">
            <form id="addressForm">
              <div class="form-group">
                <label class="form-label">Street</label>
                <input type="text" id="street" class="form-control" value="${esc(addr.street || '')}" placeholder="123 Main Street" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">City</label>
                  <input type="text" id="city" class="form-control" value="${esc(addr.city || '')}" placeholder="Mumbai" />
                </div>
                <div class="form-group">
                  <label class="form-label">State</label>
                  <input type="text" id="state" class="form-control" value="${esc(addr.state || '')}" placeholder="Maharashtra" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Pincode</label>
                <input type="text" id="pincode" class="form-control" value="${esc(addr.pincode || '')}" placeholder="400001" />
              </div>
              <button type="submit" class="btn btn-primary" id="saveAddrBtn">💾 Save Address</button>
            </form>
          </div>
        </div>

        <div style="margin-top:1.5rem;display:flex;gap:1rem;flex-wrap:wrap">
          <a href="/orders.html" class="btn btn-outline">📋 My Orders</a>
          ${user.role === 'admin' ? `<a href="/admin.html" class="btn btn-ghost">⚙️ Admin Panel</a>` : ''}
        </div>`;

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.textContent = 'Saving…';

        const { ok, data } = await apiCall('PUT', '/users/profile', {
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim(), // '' clears the phone number
        });

        btn.disabled = false; btn.innerHTML = '💾 Save Changes';
        if (ok) showToast('Profile updated successfully', 'success');
        else showAlert('alertBox', data.message, 'error');
      });

      document.getElementById('addressForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveAddrBtn');
        btn.disabled = true; btn.textContent = 'Saving…';

        const { ok, data } = await apiCall('PUT', '/users/profile', {
          address: {
            street:  document.getElementById('street').value.trim(),
            city:    document.getElementById('city').value.trim(),
            state:   document.getElementById('state').value.trim(),
            pincode: document.getElementById('pincode').value.trim(),
          }
        });

        btn.disabled = false; btn.innerHTML = '💾 Save Address';
        if (ok) showToast('Address updated successfully', 'success');
        else showAlert('alertBox', data.message, 'error');
      });
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
