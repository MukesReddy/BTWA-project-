<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users — FoodieHub Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <a href="/admin.html" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
        <a href="/admin-food.html" class="sidebar-link"><span class="icon">🍔</span> Foods</a>
        <a href="/admin-categories.html" class="sidebar-link"><span class="icon">📂</span> Categories</a>
        <a href="/admin-orders.html" class="sidebar-link"><span class="icon">📋</span> Orders</a>
        <a href="/admin-users.html" class="sidebar-link active"><span class="icon">👥</span> Users</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">👥 Users</h1>
          <p class="page-subtitle">View and manage registered users</p>
        </div>
      </div>

      <!-- Search + Filter -->
      <div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap">
        <div class="search-bar" style="flex:1;max-width:360px">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search by name or email…" />
        </div>
        <select id="roleFilter" class="form-control" style="max-width:160px">
          <option value="">All Roles</option>
          <option value="customer">Customer</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div id="alertBox" style="margin-bottom:1rem"></div>
      <div id="usersTable" class="loading-overlay"><div class="spinner"></div></div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function guardAdmin() {
      const user = await fetchCurrentUser();
      if (!user || user.role !== 'admin') { window.location.href = '/login.html'; return false; }
      return user;
    }

    let adminId = null;

    async function loadUsers() {
      const me = await guardAdmin();
      if (!me) return;
      adminId = me._id;

      const search = document.getElementById('searchInput').value.trim();
      const role   = document.getElementById('roleFilter').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (role)   params.set('role', role);

      const { ok, data } = await apiCall('GET', `/admin/users?${params}`);
      const table = document.getElementById('usersTable');
      if (!ok) { table.innerHTML = '<p class="text-muted text-center">Error loading users.</p>'; return; }

      const users = data.data;
      if (!users.length) {
        table.innerHTML = `<div class="empty-state"><div class="icon">👥</div><h3>No users found</h3></div>`;
        return;
      }

      table.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Address</th><th>Joined</th><th>Action</th></tr></thead>
        <tbody>
          ${users.map(u => `<tr>
            <td style="font-weight:600">${esc(u.name)}${u.isActive === false ? ' <span class="badge badge-cancelled" title="Account deactivated — order history kept">Deactivated</span>' : ''}</td>
            <td style="font-size:.9rem">${esc(u.email)}</td>
            <td style="font-size:.9rem;color:var(--text-secondary)">${esc(u.phone || '—')}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-customer'}">${esc(u.role)}</span></td>
            <td style="font-size:.8rem;color:var(--text-muted)">${u.address?.city ? `${esc(u.address.city)}, ${esc(u.address.state)}` : '—'}</td>
            <td style="font-size:.8rem;color:var(--text-muted)">${formatDate(u.createdAt)}</td>
            <td>
              ${u._id === adminId
                ? '<span style="font-size:.8rem;color:var(--text-muted)">You</span>'
                : u.isActive === false
                  ? `<button class="btn btn-primary btn-sm" data-action="reactivateUser" data-id="${esc(u._id)}" data-name="${esc(u.name)}" data-role="${esc(u.role)}" title="Let this user log in again">Reactivate</button>`
                  : `<button class="btn btn-danger btn-sm" data-action="deleteUser" data-id="${esc(u._id)}" data-name="${esc(u.name)}" title="Delete / deactivate user">🗑️</button>`}
            </td>
          </tr>`).join('')}
        </tbody></table></div>
        <div style="padding:1rem;font-size:.85rem;color:var(--text-muted)">${users.length} user${users.length !== 1 ? 's' : ''} found</div>`;
    }

    async function deleteUser(id, name) {
      if (!confirm(`Remove user "${name}"?\n\nUsers who have placed orders are deactivated (so order history is kept); users without orders are deleted.`)) return;
      const { ok, data } = await apiCall('DELETE', `/admin/users/${encodeURIComponent(id)}`);
      if (ok) { showToast(data.message || 'User removed', 'success'); loadUsers(); }
      else showAlert('alertBox', data.message, 'error');
    }

    // Undo a deactivation. The server only reactivates an account that is currently deactivated.
    async function reactivateUser(id, name, role) {
      const adminNote = role === 'admin' ? '\n\nThis is an ADMIN account: it will have admin access again.' : '';
      if (!confirm(`Reactivate user "${name}"?\n\nThey will be able to log in again. Their order history was kept; their old cart and sessions are not restored.${adminNote}`)) return;
      const { ok, data } = await apiCall('PUT', `/admin/users/${encodeURIComponent(id)}/reactivate`);
      if (ok) { showToast(data.message || 'User reactivated', 'success'); loadUsers(); }
      else showAlert('alertBox', data.message, 'error');
    }

    // Debounced search
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadUsers, 400);
    });
    document.getElementById('roleFilter').addEventListener('change', loadUsers);

    registerActions({
      deleteUser: (data) => deleteUser(data.id, data.name),
      reactivateUser: (data) => reactivateUser(data.id, data.name, data.role)
    });

    document.addEventListener('DOMContentLoaded', loadUsers);
  </script>
</body>
</html>
