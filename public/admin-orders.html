<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders — FoodieHub Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <a href="/admin.html" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
        <a href="/admin-food.html" class="sidebar-link"><span class="icon">🍔</span> Foods</a>
        <a href="/admin-categories.html" class="sidebar-link"><span class="icon">📂</span> Categories</a>
        <a href="/admin-orders.html" class="sidebar-link active"><span class="icon">📋</span> Orders</a>
        <a href="/admin-users.html" class="sidebar-link"><span class="icon">👥</span> Users</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">📋 All Orders</h1>
          <p class="page-subtitle">View and manage customer orders</p>
        </div>
        <a href="/api/admin/export/orders" class="btn btn-ghost btn-sm" target="_blank">📥 Export CSV</a>
      </div>

      <!-- Status Filter -->
      <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm status-filter active" data-status="">All</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Pending">Pending</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Confirmed">Confirmed</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Preparing">Preparing</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Out for Delivery">Out for Delivery</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Delivered">Delivered</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Cancelled">Cancelled</button>
      </div>

      <div id="alertBox" style="margin-bottom:1rem"></div>
      <div id="ordersTable" class="loading-overlay"><div class="spinner"></div></div>
      <div id="pagination" style="display:flex;justify-content:center;gap:.5rem;margin-top:1.5rem"></div>
    </main>
  </div>

  <!-- Order Detail Modal -->
  <div id="orderModal" class="modal-overlay hidden">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Order Details</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <div style="flex:1">
          <label class="form-label">Update Status</label>
          <div style="display:flex;gap:.5rem">
            <select id="newStatus" class="form-control"></select>
            <button id="updateStatusBtn" class="btn btn-primary" onclick="updateStatus()">Update</button>
          </div>
          <div id="statusHint" style="font-size:.8rem;color:var(--text-muted);margin-top:.4rem"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    let currentFilter = '';
    let currentPage   = 1;
    let selectedOrder = null;

    async function guardAdmin() {
      const user = await fetchCurrentUser();
      if (!user || user.role !== 'admin') { window.location.href = '/login.html'; return false; }
      return true;
    }

    async function loadOrders() {
      if (!await guardAdmin()) return;

      const table = document.getElementById('ordersTable');
      table.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

      const params = new URLSearchParams({ page: currentPage, limit: 15 });
      if (currentFilter) params.set('status', currentFilter);

      const { ok, data } = await apiCall('GET', `/admin/orders?${params}`);
      if (!ok) { table.innerHTML = '<p class="text-muted text-center">Error loading orders.</p>'; return; }

      const { orders, pagination } = data.data;
      if (!orders.length) {
        table.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>No orders found</h3></div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      table.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
        <tbody>
          ${orders.map(o => `<tr>
            <td style="font-family:monospace;font-size:.85rem">#${esc(o._id.slice(-8).toUpperCase())}</td>
            <td>
              <div style="font-weight:600">${esc(o.user?.name || 'N/A')}</div>
              <div style="font-size:.8rem;color:var(--text-muted)">${esc(o.user?.email || '')}</div>
            </td>
            <td style="font-size:.85rem">${o.items.map(i => `${esc(i.foodName)} ×${esc(i.quantity)}`).join(', ')}</td>
            <td style="font-weight:700;color:var(--primary)">${formatPrice(o.totalAmount)}</td>
            <td>${statusBadge(o.orderStatus)}${paymentBadge(o) ? `<div style="margin-top:.3rem">${paymentBadge(o)}</div>` : ''}</td>
            <td style="font-size:.8rem;color:var(--text-muted)">${formatDate(o.createdAt)}</td>
            <td><button class="btn btn-ghost btn-sm" data-action="openOrderDetail" data-id="${esc(o._id)}">Manage</button></td>
          </tr>`).join('')}
        </tbody></table></div>`;

      // Pagination
      const pg = document.getElementById('pagination');
      if (pagination.totalPages <= 1) { pg.innerHTML = ''; return; }
      pg.innerHTML = Array.from({length: pagination.totalPages}, (_, i) => `
        <button class="btn ${i+1 === pagination.page ? 'btn-primary' : 'btn-ghost'} btn-sm" data-action="changePage" data-page="${i+1}">${i+1}</button>
      `).join('');
    }

    // Offer only the legal next statuses (the server enforces the same rules and answers 409 otherwise).
    function renderStatusChoices(current, order = null) {
      const select = document.getElementById('newStatus');
      const button = document.getElementById('updateStatusBtn');
      // A UPI order whose payment is not verified may only be cancelled (the server answers 409 for anything else).
      const unpaidUpi = Boolean(order) && order.paymentMethod === 'UPI' && order.paymentStatus !== 'PAID';
      const next = allowedNextStatuses(current).filter(s => !unpaidUpi || s === 'Cancelled');
      const isFinal = allowedNextStatuses(current).length === 0;
      select.innerHTML = isFinal || next.length === 0
        ? `<option value="">— ${isFinal ? 'final status' : 'payment not verified'} —</option>`
        : next.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      select.disabled = isFinal || next.length === 0;
      button.disabled = isFinal || next.length === 0;
      document.getElementById('statusHint').textContent = isFinal
        ? `This order is ${current}. A ${current} order can no longer be changed.`
        : unpaidUpi
          ? `Current status: ${current}. The UPI payment is not verified yet, so this order can only be cancelled until it is.`
          : `Current status: ${current}.`;
    }

    async function openOrderDetail(id) {
      selectedOrder = id;
      document.getElementById('orderModal').classList.remove('hidden');
      document.getElementById('modalBody').innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

      const { ok, data } = await apiCall('GET', `/orders/${encodeURIComponent(id)}`);
      if (!ok) return;
      const o = data.data;

      document.getElementById('modalTitle').textContent = `Order #${o._id.slice(-8).toUpperCase()}`;
      renderStatusChoices(o.orderStatus, o);

      document.getElementById('modalBody').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
          <div><div style="font-size:.8rem;color:var(--text-muted)">Customer</div><div style="font-weight:600">${esc(o.user?.name || 'N/A')}</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Email</div><div style="font-size:.9rem">${esc(o.user?.email || 'N/A')}</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Total</div><div style="font-weight:700;color:var(--primary)">${formatPrice(o.totalAmount)}</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Payment</div><div style="font-size:.9rem">${esc(o.paymentMethod)} ${paymentBadge(o)}</div></div>
        </div>
        ${paymentSection(o)}
        <div style="margin-bottom:1rem">
          <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem;font-weight:600;text-transform:uppercase">Items</div>
          ${o.items.map(i => `
            <div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.9rem">
              <span>${esc(i.foodName)} × ${esc(i.quantity)}</span>
              <span style="font-weight:600">₹${esc(i.price * i.quantity)}</span>
            </div>`).join('')}
        </div>
        <div>
          <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.3rem;font-weight:600;text-transform:uppercase">Delivery Address</div>
          <div style="font-size:.9rem;color:var(--text-secondary)">
            ${esc(o.deliveryAddress?.street)}, ${esc(o.deliveryAddress?.city)}, ${esc(o.deliveryAddress?.state)} — ${esc(o.deliveryAddress?.pincode)}
          </div>
        </div>`;
    }

    // Online (UPI) payment: what the bank/provider confirmed, and the admin's controls to confirm or reject it.
    function paymentSection(o) {
      if (o.paymentMethod !== 'UPI') return '';
      const status = o.paymentStatus || 'PENDING';
      const row = (label, value) => `<div style="display:flex;justify-content:space-between;font-size:.9rem;padding:.2rem 0"><span style="color:var(--text-muted)">${esc(label)}</span><span>${esc(value)}</span></div>`;
      let body = row('Reference', o.paymentRef || '—') + row('Amount to receive', formatPrice(o.totalAmount));
      if (status === 'PAID') {
        body += row('Bank reference (UTR)', o.paymentTransactionId || '—') + row('Verified by', o.paymentVerifiedBy || '—') +
                row('Paid at', o.paidAt ? formatDate(o.paidAt) : '—');
      }
      if (status === 'PENDING' || status === 'EXPIRED' || status === 'CANCELLED') {
        body += `
          <p style="font-size:.8rem;color:var(--text-muted);margin:.6rem 0">
            Mark an order as paid only after you see <strong>${esc(formatPrice(o.totalAmount))}</strong> in the bank statement.
            ${status !== 'PENDING' ? '<br><strong>This payment already closed (' + esc(status.toLowerCase()) + '); a late payment cannot reopen the order: refund it or ask the customer to order again.</strong>' : ''}
          </p>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <input type="text" id="paymentUtr" class="form-control" style="flex:1;min-width:180px" maxlength="64" placeholder="Bank reference / UTR" autocomplete="off" />
            <button type="button" class="btn btn-primary btn-sm" data-action="markPayment" data-result="PAID">Mark as PAID</button>
            ${status === 'PENDING' ? '<button type="button" class="btn btn-danger btn-sm" data-action="markPayment" data-result="FAILED">Mark as FAILED</button>' : ''}
          </div>`;
      }
      return `<div id="paymentSection" style="margin-bottom:1rem;padding:1rem;border:1px solid var(--border);border-radius:var(--radius)">
        <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem;font-weight:600;text-transform:uppercase">Online payment (UPI)</div>${body}</div>`;
    }

    async function markPayment(result) {
      const utr = (document.getElementById('paymentUtr')?.value || '').trim();
      if (result === 'PAID' && !utr) { showAlert('alertBox', 'Enter the bank reference (UTR) from the bank statement first', 'error'); return; }
      const question = result === 'PAID'
        ? `Mark this order as PAID with reference ${utr}? Check that the bank statement shows the full amount.`
        : 'Mark this payment as FAILED? The order will be cancelled and the cart restored.';
      if (!confirm(question)) return;
      const { ok, data } = await apiCall('PUT', `/admin/orders/${encodeURIComponent(selectedOrder)}/payment`,
        result === 'PAID' ? { status: result, transactionId: utr } : { status: result });
      if (ok) showToast(data.message || 'Payment updated', 'success');
      else showAlert('alertBox', data.message, 'error');
      openOrderDetail(selectedOrder);   // show the real state again
      loadOrders();
    }

    async function updateStatus() {
      const newStatus = document.getElementById('newStatus').value;
      const { ok, data } = await apiCall('PUT', `/admin/orders/${encodeURIComponent(selectedOrder)}/status`, { status: newStatus });
      if (ok) {
        showToast(`Status updated to ${newStatus}`, 'success');
        closeModal();
        loadOrders();
      } else {
        showAlert('alertBox', data.message, 'error');
        // After a 409 (illegal step, or someone changed the order first) show the real state again
        openOrderDetail(selectedOrder);
        loadOrders();
      }
    }

    function changePage(p) { currentPage = p; loadOrders(); }
    function closeModal() { document.getElementById('orderModal').classList.add('hidden'); }

    // Status filter buttons
    document.querySelectorAll('.status-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.status-filter').forEach(b => b.classList.remove('active', 'btn-primary'));
        document.querySelectorAll('.status-filter').forEach(b => b.classList.add('btn-ghost'));
        btn.classList.remove('btn-ghost');
        btn.classList.add('active', 'btn-primary');
        currentFilter = btn.dataset.status;
        currentPage   = 1;
        loadOrders();
      });
    });

    registerActions({
      openOrderDetail: (data) => openOrderDetail(data.id),
      markPayment:     (data) => markPayment(data.result),
      changePage:      (data) => changePage(Number(data.page))
    });

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
