<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Orders — FoodieHub Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <a href="/admin.html" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
        <a href="/admin-food.html" class="sidebar-link"><span class="icon">🍔</span> Foods</a>
        <a href="/admin-categories.html" class="sidebar-link"><span class="icon">📂</span> Categories</a>
        <a href="/admin-orders.html" class="sidebar-link active"><span class="icon">📋</span> Orders</a>
        <a href="/admin-users.html" class="sidebar-link"><span class="icon">👥</span> Users</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="page-header">
        <div>
          <h1 class="page-title">📋 All Orders</h1>
          <p class="page-subtitle">View and manage customer orders</p>
        </div>
        <a href="/api/admin/export/orders" class="btn btn-ghost btn-sm" target="_blank">📥 Export CSV</a>
      </div>

      <!-- Status Filter -->
      <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm status-filter active" data-status="">All</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Pending">Pending</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Confirmed">Confirmed</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Preparing">Preparing</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Out for Delivery">Out for Delivery</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Delivered">Delivered</button>
        <button class="btn btn-ghost btn-sm status-filter" data-status="Cancelled">Cancelled</button>
      </div>

      <div id="alertBox" style="margin-bottom:1rem"></div>
      <div id="ordersTable" class="loading-overlay"><div class="spinner"></div></div>
      <div id="pagination" style="display:flex;justify-content:center;gap:.5rem;margin-top:1.5rem"></div>
    </main>
  </div>

  <!-- Order Detail Modal -->
  <div id="orderModal" class="modal-overlay hidden">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Order Details</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <div style="flex:1">
          <label class="form-label">Update Status</label>
          <div style="display:flex;gap:.5rem">
            <select id="newStatus" class="form-control">
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Preparing">Preparing</option>
              <option value="Out for Delivery">Out for Delivery</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
            <button class="btn btn-primary" onclick="updateStatus()">Update</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    let currentFilter = '';
    let currentPage   = 1;
    let selectedOrder = null;

    async function guardAdmin() {
      const user = await fetchCurrentUser();
      if (!user || user.role !== 'admin') { window.location.href = '/login.html'; return false; }
      return true;
    }

    async function loadOrders() {
      if (!await guardAdmin()) return;

      const table = document.getElementById('ordersTable');
      table.innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

      const params = new URLSearchParams({ page: currentPage, limit: 15 });
      if (currentFilter) params.set('status', currentFilter);

      const { ok, data } = await apiCall('GET', `/admin/orders?${params}`);
      if (!ok) { table.innerHTML = '<p class="text-muted text-center">Error loading orders.</p>'; return; }

      const { orders, pagination } = data.data;
      if (!orders.length) {
        table.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>No orders found</h3></div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      table.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
        <tbody>
          ${orders.map(o => `<tr>
            <td style="font-family:monospace;font-size:.85rem">#${o._id.slice(-8).toUpperCase()}</td>
            <td>
              <div style="font-weight:600">${o.user?.name || 'N/A'}</div>
              <div style="font-size:.8rem;color:var(--text-muted)">${o.user?.email || ''}</div>
            </td>
            <td style="font-size:.85rem">${o.items.map(i => `${i.foodName} ×${i.quantity}`).join(', ')}</td>
            <td style="font-weight:700;color:var(--primary)">${formatPrice(o.totalAmount)}</td>
            <td>${statusBadge(o.orderStatus)}</td>
            <td style="font-size:.8rem;color:var(--text-muted)">${formatDate(o.createdAt)}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="openOrderDetail('${o._id}')">Manage</button></td>
          </tr>`).join('')}
        </tbody></table></div>`;

      // Pagination
      const pg = document.getElementById('pagination');
      if (pagination.totalPages <= 1) { pg.innerHTML = ''; return; }
      pg.innerHTML = Array.from({length: pagination.totalPages}, (_, i) => `
        <button class="btn ${i+1 === pagination.page ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="changePage(${i+1})">${i+1}</button>
      `).join('');
    }

    async function openOrderDetail(id) {
      selectedOrder = id;
      document.getElementById('orderModal').classList.remove('hidden');
      document.getElementById('modalBody').innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

      const { ok, data } = await apiCall('GET', `/orders/${id}`);
      if (!ok) return;
      const o = data.data;

      document.getElementById('modalTitle').textContent = `Order #${o._id.slice(-8).toUpperCase()}`;
      document.getElementById('newStatus').value = o.orderStatus;

      document.getElementById('modalBody').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
          <div><div style="font-size:.8rem;color:var(--text-muted)">Customer</div><div style="font-weight:600">${o.user?.name || 'N/A'}</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Email</div><div style="font-size:.9rem">${o.user?.email || 'N/A'}</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Total</div><div style="font-weight:700;color:var(--primary)">${formatPrice(o.totalAmount)}</div></div>
          <div><div style="font-size:.8rem;color:var(--text-muted)">Payment</div><div style="font-size:.9rem">${o.paymentMethod}</div></div>
        </div>
        <div style="margin-bottom:1rem">
          <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem;font-weight:600;text-transform:uppercase">Items</div>
          ${o.items.map(i => `
            <div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.9rem">
              <span>${i.foodName} × ${i.quantity}</span>
              <span style="font-weight:600">₹${i.price * i.quantity}</span>
            </div>`).join('')}
        </div>
        <div>
          <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.3rem;font-weight:600;text-transform:uppercase">Delivery Address</div>
          <div style="font-size:.9rem;color:var(--text-secondary)">
            ${o.deliveryAddress?.street}, ${o.deliveryAddress?.city}, ${o.deliveryAddress?.state} — ${o.deliveryAddress?.pincode}
          </div>
        </div>`;
    }

    async function updateStatus() {
      const newStatus = document.getElementById('newStatus').value;
      const { ok, data } = await apiCall('PUT', `/admin/orders/${selectedOrder}/status`, { status: newStatus });
      if (ok) {
        showToast(`Status updated to ${newStatus}`, 'success');
        closeModal();
        loadOrders();
      } else {
        showAlert('alertBox', data.message, 'error');
      }
    }

    function changePage(p) { currentPage = p; loadOrders(); }
    function closeModal() { document.getElementById('orderModal').classList.add('hidden'); }

    // Status filter buttons
    document.querySelectorAll('.status-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.status-filter').forEach(b => b.classList.remove('active', 'btn-primary'));
        document.querySelectorAll('.status-filter').forEach(b => b.classList.add('btn-ghost'));
        btn.classList.remove('btn-ghost');
        btn.classList.add('active', 'btn-primary');
        currentFilter = btn.dataset.status;
        currentPage   = 1;
        loadOrders();
      });
    });

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
