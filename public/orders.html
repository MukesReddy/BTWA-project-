<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — FoodieHub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main style="padding-top:calc(var(--navbar-height) + 2rem)">
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">📋 My Orders</h1>
          <p class="page-subtitle">Track your food orders</p>
        </div>
      </div>

      <div id="ordersContent" class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </main>

  <!-- Order Detail Modal -->
  <div id="orderModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Order Details</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function loadOrders() {
      const content = document.getElementById('ordersContent');

      const user = await fetchCurrentUser();
      if (!user) { window.location.href = '/login.html?redirect=/orders.html'; return; }

      const { ok, data } = await apiCall('GET', '/orders');
      if (!ok) { content.innerHTML = '<p class="text-center text-muted">Error loading orders.</p>'; return; }

      const orders = data.data;
      if (!orders.length) {
        content.innerHTML = `<div class="empty-state">
          <div class="icon">📋</div>
          <h3>No orders yet</h3>
          <p>You haven't placed any orders yet. Start ordering!</p>
          <a href="/menu.html" class="btn btn-primary">Browse Menu</a>
        </div>`;
        return;
      }

      content.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:1rem">
          ${orders.map(order => `
            <div class="card" style="cursor:pointer;transition:var(--transition)" onclick="showOrderDetail('${order._id}')">
              <div class="card-body">
                <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem">
                  <div>
                    <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.2rem">ORDER ID</div>
                    <div style="font-family:monospace;font-size:.85rem;color:var(--text-secondary)">#${order._id.slice(-8).toUpperCase()}</div>
                  </div>
                  <div>
                    <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.2rem">DATE</div>
                    <div style="font-size:.9rem">${formatDate(order.createdAt)}</div>
                  </div>
                  <div>
                    <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.2rem">ITEMS</div>
                    <div style="font-size:.9rem">${order.items.length} item${order.items.length > 1 ? 's' : ''}</div>
                  </div>
                  <div>
                    <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.2rem">TOTAL</div>
                    <div style="font-size:1.1rem;font-weight:700;color:var(--primary)">${formatPrice(order.totalAmount)}</div>
                  </div>
                  <div style="text-align:right">
                    ${statusBadge(order.orderStatus)}
                    <div style="font-size:.8rem;color:var(--text-muted);margin-top:.3rem">${order.paymentMethod}</div>
                  </div>
                  <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showOrderDetail('${order._id}')">View Details →</button>
                </div>
                <!-- Items preview -->
                <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);display:flex;gap:.5rem;flex-wrap:wrap">
                  ${order.items.map(i => `<span style="font-size:.85rem;color:var(--text-secondary);background:var(--bg-glass);border:1px solid var(--border);border-radius:20px;padding:.2rem .6rem">${i.foodName} ×${i.quantity}</span>`).join('')}
                </div>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    async function showOrderDetail(orderId) {
      document.getElementById('orderModal').classList.remove('hidden');
      document.getElementById('modalBody').innerHTML = '<div class="loading-overlay"><div class="spinner"></div></div>';

      const { ok, data } = await apiCall('GET', `/orders/${orderId}`);
      if (!ok) { document.getElementById('modalBody').innerHTML = '<p class="text-muted text-center">Error loading order.</p>'; return; }

      const order = data.data;
      document.getElementById('modalTitle').textContent = `Order #${order._id.slice(-8).toUpperCase()}`;

      const statusSteps = ['Pending','Confirmed','Preparing','Out for Delivery','Delivered'];
      const currentIdx  = statusSteps.indexOf(order.orderStatus);

      document.getElementById('modalBody').innerHTML = `
        <div style="margin-bottom:1.5rem">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
            <span style="font-size:.85rem;color:var(--text-muted)">Status</span>
            ${statusBadge(order.orderStatus)}
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
            <span style="font-size:.85rem;color:var(--text-muted)">Placed on</span>
            <span style="font-size:.9rem">${formatDate(order.createdAt)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:.85rem;color:var(--text-muted)">Payment</span>
            <span style="font-size:.9rem">${order.paymentMethod}</span>
          </div>
        </div>

        ${order.orderStatus !== 'Cancelled' ? `
        <div style="margin-bottom:1.5rem">
          <div style="font-size:.85rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem">Order Progress</div>
          <div style="display:flex;gap:.3rem">
            ${statusSteps.map((step, i) => `
              <div style="flex:1;text-align:center">
                <div style="height:4px;border-radius:2px;background:${i <= currentIdx ? 'var(--primary)' : 'var(--border)'}; margin-bottom:.4rem"></div>
                <div style="font-size:.7rem;color:${i <= currentIdx ? 'var(--primary)' : 'var(--text-muted)'};font-weight:${i === currentIdx ? '700' : '400'}">${step.split(' ')[0]}</div>
              </div>
            `).join('')}
          </div>
        </div>` : ''}

        <div style="margin-bottom:1.5rem">
          <div style="font-size:.85rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem">Ordered Items</div>
          ${order.items.map(item => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border)">
              <div>
                <div style="font-weight:600;font-size:.9rem">${item.foodName}</div>
                <div style="font-size:.8rem;color:var(--text-muted)">₹${item.price} × ${item.quantity}</div>
              </div>
              <div style="font-weight:700;color:var(--primary)">₹${item.price * item.quantity}</div>
            </div>
          `).join('')}
          <div style="display:flex;justify-content:space-between;padding:.75rem 0;font-size:1.1rem;font-weight:800">
            <span>Total</span>
            <span style="color:var(--primary)">${formatPrice(order.totalAmount)}</span>
          </div>
        </div>

        <div>
          <div style="font-size:.85rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem">Delivery Address</div>
          <div style="background:var(--bg-dark);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem;font-size:.9rem;color:var(--text-secondary)">
            ${order.deliveryAddress?.street}, ${order.deliveryAddress?.city},<br/>
            ${order.deliveryAddress?.state} — ${order.deliveryAddress?.pincode}
          </div>
        </div>`;
    }

    function closeModal() {
      document.getElementById('orderModal').classList.add('hidden');
    }

    document.getElementById('orderModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener('DOMContentLoaded', loadOrders);
  </script>
</body>
</html>
